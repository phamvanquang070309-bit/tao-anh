<canvas id="canvas" width="900" height="600"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// ===============================
// ẢNH NỀN
// ===============================

const background = new Image();

background.src =
"1790326127309_8031632657929208865_8031632657929208865_a9dc84cb4212dd04f23c085ca5439725.jpg";


// ===============================
// KHUNG CHỨA NGƯỜI
// ===============================

let frame = {
    x: 300,
    y: 150,
    width: 300,
    height: 300
};


// ===============================
// ẢNH NGƯỜI
// ===============================

const person = new Image();

let personData = {
    x: 450,
    y: 300,
    scale: 0.3,
    rotation: 0
};


// ===============================
// VẼ ẢNH
// ===============================

function draw() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Vẽ nền
    ctx.drawImage(
        background,
        0,
        0,
        canvas.width,
        canvas.height
    );


    // Vẽ người
    if (person.src) {

        const w = person.naturalWidth * personData.scale;
        const h = person.naturalHeight * personData.scale;

        ctx.save();

        ctx.translate(
            personData.x,
            personData.y
        );

        ctx.rotate(personData.rotation);

        ctx.drawImage(
            person,
            -w / 2,
            -h / 2,
            w,
            h
        );

        ctx.restore();
    }


    // Vẽ khung để dễ chỉnh
    ctx.save();

    ctx.strokeStyle = "red";
    ctx.lineWidth = 3;
    ctx.setLineDash([10, 5]);

    ctx.strokeRect(
        frame.x,
        frame.y,
        frame.width,
        frame.height
    );

    ctx.restore();
}


// ===============================
// CHỌN ẢNH NGƯỜI
// ===============================

document.getElementById("personInput").addEventListener(
    "change",
    function(event) {

        const file = event.target.files[0];

        if (!file) return;

        const reader = new FileReader();

        reader.onload = function(e) {

            person.onload = function() {

                personData.x =
                    frame.x + frame.width / 2;

                personData.y =
                    frame.y + frame.height / 2;

                personData.scale = 0.3;
                personData.rotation = 0;

                draw();
            };

            person.src = e.target.result;
        };

        reader.readAsDataURL(file);
    }
);


// ===============================
// TỰ CHỈNH KHUNG
// ===============================

function updateFrame() {

    frame.x =
        Number(document.getElementById("frameX").value);

    frame.y =
        Number(document.getElementById("frameY").value);

    frame.width =
        Number(document.getElementById("frameW").value);

    frame.height =
        Number(document.getElementById("frameH").value);

    // Đưa người vào giữa khung
    personData.x =
        frame.x + frame.width / 2;

    personData.y =
        frame.y + frame.height / 2;

    draw();
}


// ===============================
// KÉO NGƯỜI
// ===============================

let dragging = false;
let offsetX = 0;
let offsetY = 0;

canvas.addEventListener("mousedown", function(e) {

    if (!person.src) return;

    const rect = canvas.getBoundingClientRect();

    const mouseX =
        (e.clientX - rect.left)
        * canvas.width / rect.width;

    const mouseY =
        (e.clientY - rect.top)
        * canvas.height / rect.height;

    dragging = true;

    offsetX =
        mouseX - personData.x;

    offsetY =
        mouseY - personData.y;
});
