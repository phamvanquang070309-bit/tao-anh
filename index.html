<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghép ảnh</title>

    <style>
        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
        }

        h1 {
            color: #333;
        }

        input {
            margin: 20px 0;
        }

        canvas {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 20px auto;
            border-radius: 10px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

    <h1>Ghép ảnh của bạn</h1>

    <p>Chọn ảnh của bạn:</p>

    <input type="file" id="upload" accept="image/*">

    <canvas id="canvas"></canvas>

    <button id="download">Tải ảnh xuống</button>

    <script>
        const upload = document.getElementById("upload");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const download = document.getElementById("download");

        const background = new Image();

        background.src =
            "1790326127309_8031632657929208865_8031632657929208865_a9dc84cb4212dd04f23c085ca5439725.jpg";

        upload.addEventListener("change", function () {

            const file = upload.files[0];

            if (!file) {
                return;
            }

            const userImage = new Image();

            userImage.onload = function () {

                canvas.width = background.naturalWidth;
                canvas.height = background.naturalHeight;

                // Vẽ ảnh nền
                ctx.drawImage(
                    background,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                // Vị trí ảnh người dùng
                const x = 300;
                const y = 200;
                const width = 400;
                const height = 400;

                // Vẽ ảnh người dùng
                ctx.drawImage(
                    userImage,
                    x,
                    y,
                    width,
                    height
                );
            };

            userImage.src = URL.createObjectURL(file);
        });

        download.addEventListener("click", function () {

            if (canvas.width === 0 || canvas.height === 0) {
                alert("Vui lòng chọn ảnh trước!");
                return;
            }

            const link = document.createElement("a");

            link.download = "anh-da-ghep.png";

            link.href = canvas.toDataURL("image/png");

            link.click();
        });
    </script>

</body>
</html>
